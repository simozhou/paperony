# Save as .github/workflows/weekly_fetch.yml in a GitHub repository that contains fetch_papers.py.
# Runs every Friday and commits the JSON files to the reports/ folder of the repository.
name: Weekly literature fetch

on:
  schedule:
    - cron: "0 5 * * 5"   # Fridays at 05:00 UTC; adjust to your timezone
  workflow_dispatch:       # adds a "Run workflow" button for manual runs

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_papers.py --outdir reports
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # optional; add under Settings > Secrets
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}       # optional
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports
          git commit -m "Literature fetch $(date +%F)" || echo "Nothing new to commit"
          git push
